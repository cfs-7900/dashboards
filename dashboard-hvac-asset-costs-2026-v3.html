<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HVAC Asset Cost Dashboard 2025-2026</title>
<style>
:root { --bg:#f5f7fb; --card:#ffffff; --ink:#172033; --muted:#667085; --line:#d9e0ea; --accent:#1B3765; --soft:#edf2f8; --bad:#8a1f11; }
* { box-sizing:border-box; }
body { margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--ink); }
header { background:var(--accent); color:white; padding:22px 28px; }
header h1 { margin:0 0 6px; font-size:26px; }
header p { margin:0; opacity:.9; font-size:14px; }
main { padding:22px; max-width:1500px; margin:auto; }
.grid { display:grid; gap:16px; }
.kpis { grid-template-columns:repeat(7,minmax(140px,1fr)); }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 1px 3px rgba(16,24,40,.06); }
.kpi .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
.kpi .value { font-size:24px; font-weight:700; margin-top:8px; }
.controls { display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr auto; gap:10px; align-items:end; }
label { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
input, select, button { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:white; color:var(--ink); }
button { cursor:pointer; background:var(--accent); color:white; border-color:var(--accent); font-weight:700; }
.charts { grid-template-columns:2fr 1fr; }
.chart-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.chart-title h2 { font-size:18px; margin:0; }
.small { color:var(--muted); font-size:12px; }
.bar-row { display:grid; grid-template-columns:minmax(130px,230px) 1fr 110px; gap:10px; align-items:center; margin:8px 0; }
.bar-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
.bar-wrap { height:22px; background:var(--soft); border-radius:999px; overflow:hidden; }
.bar { height:100%; background:var(--accent); border-radius:999px; min-width:2px; }
.num { text-align:right; font-variant-numeric:tabular-nums; font-size:13px; }
.split { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.pill { background:var(--soft); padding:12px; border-radius:12px; }
.pill strong { display:block; font-size:18px; margin-top:6px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { border-bottom:1px solid var(--line); padding:9px 8px; text-align:left; vertical-align:top; }
th { position:sticky; top:0; background:#f8fafc; color:#344054; cursor:pointer; z-index:1; }
td.money, th.money { text-align:right; font-variant-numeric:tabular-nums; }
.table-wrap { max-height:520px; overflow:auto; border:1px solid var(--line); border-radius:12px; }
.note { margin-top:10px; color:var(--muted); font-size:12px; }
@media (max-width:1100px) { .kpis, .charts { grid-template-columns:1fr 1fr; } .controls { grid-template-columns:1fr 1fr; } }
@media (max-width:700px) { main { padding:12px; } .kpis,.charts,.controls,.split { grid-template-columns:1fr; } .bar-row { grid-template-columns:1fr; } .num { text-align:left; } }
</style>
</head>
<body>
<header>
  <h1>HVAC Asset Cost Dashboard</h1>
  <p>Interactive view of HVAC equipment work order costs from the uploaded 2025–2026 asset cost file.</p>
</header>
<main>
  <section class="grid kpis" id="kpis"></section>
  <section class="card" style="margin-top:16px;">
    <div class="controls">
      <div><label>Search</label><input id="search" placeholder="Search asset, description, work order..." /></div>
      <div><label>Year</label><select id="year"><option value="">All years</option></select></div>
      <div><label>Asset</label><select id="asset"><option value="">All assets</option></select></div>
      <div><label>Type</label><select id="type"><option value="">All types</option></select></div>
      <div><label>Minimum total cost</label><input id="minCost" type="number" min="0" step="1" placeholder="0" /></div>
      <div><button id="reset">Reset</button></div>
    </div>
  </section>
  <section class="grid charts" style="margin-top:16px;">
    <div class="card">
      <div class="chart-title"><h2>Top Assets by Total Cost</h2><span class="small" id="topCount"></span></div>
      <div id="assetBars"></div>
    </div>
    <div class="card">
      <div class="chart-title"><h2>Cost Mix</h2><span class="small">Filtered rows</span></div>
      <div class="split" id="costMix"></div>
      <div style="margin-top:18px;" id="typeBars"></div>
    </div>
  </section>
  <section class="card" style="margin-top:16px;">
    <div class="chart-title"><h2>Work Order Detail</h2><span class="small" id="rowCount"></span></div>
    <div class="table-wrap"><table id="tbl"></table></div>
    <div class="note">Click column headers to sort. Dashboard is self-contained and does not require internet access.</div>
  </section>
</main>

const $ = id => document.getElementById(id);
const money = n => Number(n || 0).toLocaleString(undefined, {style:'currency', currency:'USD', maximumFractionDigits:0});
const num = n => Number(n || 0).toLocaleString();
const clean = v => (v ?? '').toString();
let sortKey = 'Total Costs';
let sortDir = -1;

function getYear(row) {
  const raw = clean(row['Closed']);
  if (!raw) return '';
  const match = raw.match(/\b(20\d{2}|19\d{2})\b/);
  if (match) return match[1];
  const parsed = new Date(raw);
  if (!isNaN(parsed)) return String(parsed.getFullYear());
  return '';
}

function normalizeRows() {
  DATA.forEach(r => {
    r['_Year'] = getYear(r);
    ['Labor Cost','Materials Cost','Contractor Costs','Total Costs'].forEach(k => r[k] = Number(r[k] || 0));
  });
}

function uniqueValues(key) {
  return [...new Set(DATA.map(r => clean(r[key])).filter(Boolean))].sort((a,b)=>a.localeCompare(b, undefined, {numeric:true}));
}

function fillSelect(id, values, label) {
  const el = $(id);
  el.innerHTML = `<option value="">${label}</option>` + values.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
}

function escapeHtml(s) {
  return clean(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function filteredRows() {
  const q = clean($('search').value).toLowerCase();
  const year = $('year').value;
  const asset = $('asset').value;
  const type = $('type').value;
  const minCost = Number($('minCost').value || 0);
  return DATA.filter(r => {
    const hay = [r['Work Order #'], r['Closed'], r['Asset ID'], r['Description'], r['Type Desc']].map(clean).join(' ').toLowerCase();
    return (!q || hay.includes(q))
      && (!year || r['_Year'] === year)
      && (!asset || clean(r['Asset ID']) === asset)
      && (!type || clean(r['Type Desc']) === type)
      && Number(r['Total Costs'] || 0) >= minCost;
  });
}

function sum(rows, key) { return rows.reduce((a,r)=>a+Number(r[key]||0),0); }

function groupSum(rows, key, valKey='Total Costs') {
  const out = {};
  rows.forEach(r => {
    const k = clean(r[key]) || '(blank)';
    out[k] = (out[k] || 0) + Number(r[valKey] || 0);
  });
  return Object.entries(out).sort((a,b)=>b[1]-a[1]);
}

function renderKpis(rows) {
  const total = sum(rows, 'Total Costs');
  const labor = sum(rows, 'Labor Cost');
  const materials = sum(rows, 'Materials Cost');
  const contractor = sum(rows, 'Contractor Costs');
  const assets = new Set(rows.map(r => clean(r['Asset ID'])).filter(Boolean)).size;
  const avg = rows.length ? total / rows.length : 0;
  const top = groupSum(rows, 'Asset ID')[0] || ['-',0];
  const cards = [
    ['Total Cost', money(total)],
    ['Work Orders', num(rows.length)],
    ['Assets', num(assets)],
    ['Contractor Cost', money(contractor)],
    ['Labor Cost', money(labor)],
    ['Materials Cost', money(materials)],
    ['Avg / WO', money(avg)]
  ];
  $('kpis').innerHTML = cards.map(([label,value]) => `<div class="card kpi"><div class="label">${label}</div><div class="value">${value}</div></div>`).join('');
}

function renderBars(id, rows, key, limit=12) {
  const data = groupSum(rows, key).slice(0, limit);
  const max = data.length ? data[0][1] : 1;
  $(id).innerHTML = data.length ? data.map(([label,value]) => `
    <div class="bar-row" title="${escapeHtml(label)}: ${money(value)}">
      <div class="bar-label">${escapeHtml(label)}</div>
      <div class="bar-wrap"><div class="bar" style="width:${Math.max(1, value / max * 100)}%;"></div></div>
      <div class="num">${money(value)}</div>
    </div>
  `).join('') : '<div class="small">No records match the current filters.</div>';
}

function renderCostMix(rows) {
  const labor = sum(rows, 'Labor Cost');
  const materials = sum(rows, 'Materials Cost');
  const contractor = sum(rows, 'Contractor Costs');
  $('costMix').innerHTML = `
    <div class="pill"><span class="small">Labor</span><strong>${money(labor)}</strong></div>
    <div class="pill"><span class="small">Materials</span><strong>${money(materials)}</strong></div>
    <div class="pill"><span class="small">Contractor</span><strong>${money(contractor)}</strong></div>
  `;
  renderBars('typeBars', rows, 'Type Desc', 8);
}

function renderTable(rows) {
  const cols = ['Work Order #','Closed','Asset ID','Description','Type Desc','Labor Cost','Materials Cost','Contractor Costs','Total Costs'];
  const sorted = [...rows].sort((a,b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (typeof av === 'number' || typeof bv === 'number') return (Number(av||0)-Number(bv||0))*sortDir;
    return clean(av).localeCompare(clean(bv), undefined, {numeric:true}) * sortDir;
  });
  $('rowCount').textContent = `${num(sorted.length)} rows`;
  const head = '<thead><tr>' + cols.map(c => `<th class="${c.includes('Cost') ? 'money' : ''}" data-key="${c}">${c}${sortKey===c ? (sortDir===1?' ▲':' ▼') : ''}</th>`).join('') + '</tr></thead>';
  const body = '<tbody>' + sorted.map(r => '<tr>' + cols.map(c => {
    const cls = c.includes('Cost') ? 'money' : '';
    const val = c.includes('Cost') ? money(r[c]) : escapeHtml(clean(r[c])).replace(/%0D%0A|\r\n|\n/g, '<br>');
    return `<td class="${cls}">${val}</td>`;
  }).join('') + '</tr>').join('') + '</tbody>';
  $('tbl').innerHTML = head + body;
  document.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
    const k = th.getAttribute('data-key');
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = k.includes('Cost') ? -1 : 1; }
    update();
  }));
}

function update() {
  const rows = filteredRows();
  renderKpis(rows);
  renderBars('assetBars', rows, 'Asset ID', 15);
  $('topCount').textContent = `Top ${Math.min(15, groupSum(rows, 'Asset ID').length)} of ${num(new Set(rows.map(r=>r['Asset ID'])).size)} assets`;
  renderCostMix(rows);
  renderTable(rows);
}

function init() {
  normalizeRows();
  fillSelect('year', [...new Set(DATA.map(r => r['_Year']).filter(Boolean))].sort(), 'All years');
  fillSelect('asset', uniqueValues('Asset ID'), 'All assets');
  fillSelect('type', uniqueValues('Type Desc'), 'All types');
  ['search','year','asset','type','minCost'].forEach(id => $(id).addEventListener('input', update));
  $('reset').addEventListener('click', () => {
    ['search','year','asset','type','minCost'].forEach(id => $(id).value = '');
    sortKey = 'Total Costs';
    sortDir = -1;
    update();
  });
  update();
}
init();
</script>
